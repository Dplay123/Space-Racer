// Creacion de variables del Salto perroni

    let normal= contact.ni;

    }

    if (normal.y > 0.5){

    }

 function tecladones (){

  ob2.position.copy(nave.position);
  ob2.quaternion.copy(nave.quaternion);

    //rotation.x=((reloj.getElapsedTime()*vel3*2*amp3*2)*.5)+.5;
  }

  //Funcion para que la navecita se mueva sola y velocidad progresiva
  let speedMultiplier = 10;
  let lateralSpeed = 0;

if (puntos >= 3) speedMultiplier = 15;
if (puntos >= 6) speedMultiplier = 20;
if (puntos >= 9) speedMultiplier = 25;

if (keys['KeyA']) {
   lateralSpeed= 15;
    rot2=(reloj.getElapsedTime()*vel)*amp;
    ob1.rotation.z = ((reloj.getElapsedTime()*vel*amp)+.5);
    ob1.scale.z = ((reloj.getElapsedTime()*vel2*amp2)+.5);
    ob1.scale.z =.8;
   if (puntos >= 3){

   }

    lateralSpeed = 25;
   }
 
} else if (keys['KeyD']) {
   lateralSpeed =- 15;
   currentSpeed = Math.max(currentSpeed - desascelaracion, -movmentspeed);
    rot2 = (reloj.getElapsedTime()*vel)*-amp;
    ob1.rotation.z= ((reloj.getElapsedTime()*vel*amp)-.5);
    ob1.scale.z = ((reloj.getElapsedTime()*vel2*amp2)-.5);
    ob1.scale.z =.8;
   if (puntos >= 3){
    lateralSpeed = -20;
   }
   if (puntos >= 6){
    lateralSpeed = -25;
   }
  
  }
  else {
    rot2=0;
    ob1.rotation.z=0;
    ob1.scale.z=1;
  
} 

nave.velocity.set(

 }

function updatePuntos() {
  datap.forEach(obj1 => {

      ob2.position);
    if (distancia < radioDeteccion) {

      puntos++;
      //puntos=puntos+10;
      moverObjeto(obj1);

  datap1.forEach(enemigo => {

  });
    }
    // sincronizar body con mesh (por si usas debug o futuras colisiones)
    obj1.body.position.copy(obj1.mesh.position);
  });
}

function moverObjeto(obj1) {
  let posX;
  let distancia;
  let tempPos; 

  const forward = new THREE.Vector3();
  ob2.getWorldDirection(forward);

  

  do {
    const randomIndex = Math.floor(Math.random() * carrilesX.length);
    posX = carrilesX[randomIndex];

    tempPos = ob2.position.clone().add(
      forward.clone().multiplyScalar(100)
    );

    tempPos.x = posX;
    tempPos.y = 3;

    distancia = tempPos.distanceTo(ob2.position);

    
  } while (distancia < 50);

  obj1.mesh.position.copy(tempPos);
  obj1.body.position.copy(tempPos);
}


//Movment de haters perrones


const radioDeteccion1= 10;
function RestarLife() {
  datap1.forEach(obj2 => {
    const distancia1 = obj2.mesh.position.distanceTo(
      ob2.position);
    if (distancia1 < radioDeteccion1) {
      console.log("punto");
      vida=vida-10;
      //puntos=puntos+10;
      moverObjeto1(obj2);

    datap.forEach(punticos => {
    moverObjeto(punticos);})
      
    }
    // sincronizar body con mesh (por si usas debug o futuras colisiones)
    obj2.body.position.copy(obj2.mesh.position);
  });
}

function moverObjeto1(obj2) {

  const forward = new THREE.Vector3();
  ob2.getWorldDirection(forward);

  const posX = carrilesX[Math.floor(Math.random() * carrilesX.length)];

  const tempPos = ob2.position.clone()

  tempPos.x = posX;
  tempPos.y = 3;

  obj2.mesh.position.copy(tempPos);
  obj2.body.position.copy(tempPos);
}
