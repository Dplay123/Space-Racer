function moverObjeto3(obj4) {
  let posX2;
  let distancia3;
  let tempPos3; 

  const forward = new THREE.Vector3();
  osb2.getWorldDirection(forward);

  let intentos = 0;
  const maxIntentos = 10
  

  do {
    const distanciaRandom = 80 + Math.random() * 60;
    posX2 =obtenerCarrilLibre();

    tempPos3 = osb2.position.clone().add(
      forward.clone().multiplyScalar(distanciaRandom)
    );

    tempPos3.x = posX2;
    tempPos3.y = 3;

    distancia3 = tempPos3.distanceTo(osb2.position);

    intentos++;

    if (intentos > maxIntentos) break;
    
  } while (distancia3 < 50||
    CarrilZ(tempPos3.x, tempPos3.z));

  obj4.mesh.position.copy(tempPos3);
  obj4.body.position.copy(tempPos3);
}

let megaActivo= false;
let recuperaLife= false;
let relento=false;

function CarrilZ(posX, posZ) {
  const todos = [...datap, ...datap1, ...datap2, ...datap3,...datap4];

  return todos.some(obj => {
    const dx = Math.abs(obj.mesh.position.x - posX);
    const dz = Math.abs(obj.mesh.position.z - posZ);

    return dx < 5 && dz < 40; 
  });
}

function obtenerCarrilLibre() {

  const CarrilLibre = [...datap,...datap1,...datap2,...datap3,...datap4];
  const ocu =CarrilLibre.map(obj => Math.round(obj.mesh.position.x));
  const liv = carrilesX.filter(x => !ocu.includes(x));
  if (liv.length === 0){
    return carrilesX[Math.floor(Math.random() * carrilesX.length)];
  }
  return liv[Math.floor(Math.random() * liv.length)];

  
}


function spawnAutomatico(lista) {
  lista.forEach(obj => {

    if (!obj.activo) return;

    const distancia = obj.mesh.position.distanceTo(osb2.position);

    if (distancia > 200 || obj.mesh.position.z < osb2.position.z - 50) {
      moverObjeto(obj);
    }

  });
}

const decoraciones = [dec1, dec2, dec3, dec4, dec5, dec6];

function posicionarDecoraciones() {
  decoraciones.forEach(obj => {

    let x;

    // Generar posición fuera de carriles
    do {
      x = (Math.random() - 0.5) * 100;
    } while (Math.abs(x - (-20)) < 5 || 
             Math.abs(x - 0) < 5 || 
             Math.abs(x - 20) < 5);

    const z = Math.random() * 1500;
    const y = 0;

    obj.position.set(x, y, z);

    scene.add(obj);

    obj.rotation.y = Math.random() * Math.PI * 2;
    obj.scale.multiplyScalar(0.3 + Math.random() * 0.5);
  });
}
