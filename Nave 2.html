<!DOCTYPE html>
<html>
<head>
    <title>Práctica 05</title>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>

<canvas id="myCanvas"></canvas>

<script type="importmap"> 
{
    "imports":{
        "three": "./js/three.module.js",
        "three/OrbitControls": "./js/OrbitControls.js" 
    }
}
</script>

<script type="module"> 

import * as THREE from 'three'; 
import { OrbitControls } from 'three/OrbitControls';

// 🎮 Renderer
const renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'),
    antialias: true
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

// 🎬 Escena
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000011);

// 🎥 Cámara
const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    2000
);
camera.position.set(-15, 8, 0);
camera.lookAt(0, 3, 0);

// 💡 Luz
const light = new THREE.PointLight(0xffffff, 2, 1000);
light.position.set(0, 20, 20);
scene.add(light);

// 🌎 Piso
const planeGeo = new THREE.PlaneGeometry(50, 50);
const planeMat = new THREE.MeshLambertMaterial({
    color: 0xffffff,
    side: THREE.DoubleSide
});
const plane = new THREE.Mesh(planeGeo, planeMat);
plane.rotation.x = Math.PI / 2;
scene.add(plane);

// 🚀 ================= NAVE =================
const nave = new THREE.Group();
scene.add(nave);

// 🛢 Cuerpo
const cuerpo = new THREE.Mesh(
    new THREE.CylinderGeometry(1.2, 1.2, 8, 32),
    new THREE.MeshLambertMaterial({ color: 0x999999 })
);
cuerpo.rotation.z = Math.PI / 2;
cuerpo.position.y = 3;
nave.add(cuerpo);

// 🔺 Punta
const punta = new THREE.Mesh(
    new THREE.ConeGeometry(1.2, 3, 32),
    new THREE.MeshLambertMaterial({ color: 0xff3333 })
);
punta.rotation.z = -Math.PI / 2;
punta.position.set(5.5, 3, 0);
nave.add(punta);

// 🔵 Cabina
const cabina = new THREE.Mesh(
    new THREE.SphereGeometry(1.3, 32, 32),
    new THREE.MeshLambertMaterial({ color: 0x00ccff })
);
cabina.position.set(1.5, 4, 0);
nave.add(cabina);

// 🪽 Alas
const ala1 = new THREE.Mesh(
    new THREE.BoxGeometry(5, 0.3, 2),
    new THREE.MeshLambertMaterial({ color: 0x2222ff })
);
ala1.position.set(0, 2.5, 3);
ala1.rotation.x = 0.3;
nave.add(ala1);

const ala2 = ala1.clone();
ala2.position.z = -3;
ala2.rotation.x = -0.3;
nave.add(ala2);

// 🔥 Motor
const motor = new THREE.Mesh(
    new THREE.CylinderGeometry(0.8, 0.8, 2, 32),
    new THREE.MeshLambertMaterial({ color: 0xff8800 })
);
motor.rotation.z = Math.PI / 2;
motor.position.set(-5, 3, 0);
nave.add(motor);

nave.position.set(0, 2, 0);

// 🎮 Controles cámara
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// ⌨️ Teclado
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// ⏱ Reloj
const reloj = new THREE.Clock();

// 🎮 Movimiento
function mov() {
    if (keys['KeyW']) nave.position.z -= 0.3;
    if (keys['KeyS']) nave.position.z += 0.3;
    if (keys['KeyA']) nave.position.x -= 0.3;
    if (keys['KeyD']) nave.position.x += 0.3;
}

// 🎬 Render
function render() {

    mov();

    const t = reloj.getElapsedTime();

    // 🔥 Animación motor
    motor.scale.x = 1 + Math.sin(t * 15) * 0.2;

    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(render);
}

render();

// 🔄 Resize automático
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
