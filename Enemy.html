<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>Práctica 01</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>
<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    console.log(OrbitControls);
    import{RoundedBoxGeometry} from './js/RoundedBoxGeometry.js';

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);


// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 10);

    // Luz direccional
    var light = new THREE.DirectionalLight(0xFFFFFF, 1);
    light.castShadow = true;
    light.position.set(20, 30, 20); 
    light.target.position.set(0, 0, 0);
    scene.add(light.target);
    scene.add(light);
    renderer.shadowMap.enabled = true;


    // Cámara de sombras
    light.shadow.camera.top = 30;     
    light.shadow.camera.bottom = -30;
    light.shadow.camera.left = -30;
    light.shadow.camera.right = 30;
    light.shadow.camera.visible = true;
    light.shadow.mapSize.width = 1024;
    light.shadow.mapSize.height = 1024;

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

// Espacio para colocar los objetos
   

var geo1 = new THREE.SphereGeometry(2.5,50);
var m1 = new THREE.MeshLambertMaterial ({
        color: 0x787878, side: THREE.DoubleSide
    });
var mesh01 = new THREE.Mesh(geo1,m1);
mesh01.position.set(0,0,0);
scene.add(mesh01);

var geo2 = new THREE.SphereGeometry(.5,50);
var m2 = new THREE.MeshLambertMaterial ({
        color: 0x303030, side: THREE.DoubleSide
    });
var mesh02 = new THREE.Mesh(geo2,m2);
mesh02.position.set(2.3,1,0);
scene.add(mesh02);

var geo3 = new THREE.SphereGeometry(1.4,50);
var m3 = new THREE.MeshLambertMaterial ({
        color: 0x303030, side: THREE.DoubleSide
    });
var mesh03 = new THREE.Mesh(geo3,m3);
mesh03.position.set(-2.3,-1,0);
scene.add(mesh03);

var geo4 = new THREE.SphereGeometry(1.7,50);
var m4 = new THREE.MeshLambertMaterial ({
        color: 0x303030, side: THREE.DoubleSide
    });
var mesh04 = new THREE.Mesh(geo4,m4);
mesh04.position.set(-.3,1.3,-.8);
scene.add(mesh04);

var geo5 = new THREE.SphereGeometry(.9,50);
var m5 = new THREE.MeshLambertMaterial ({
        color: 0x303030, side: THREE.DoubleSide
    });
var mesh05 = new THREE.Mesh(geo3,m3);
mesh05.position.set(.3,1,1);
scene.add(mesh05);

//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {

    //🪄🪄 Animación - 

    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();

    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>
</body>
</html>
