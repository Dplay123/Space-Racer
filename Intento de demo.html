 function tecladones (){

  

   var forward = new CANNON.Vec3(0, 0, -1);
  ob2.getWorldDirection(forward);
  forward.normalize();

  ob2.position.copy(nave.position);
  ob2.quaternion.copy(nave.quaternion);

    rot2=(reloj.getElapsedTime()*vel)*amp;
    ob1.rotation.z = ((reloj.getElapsedTime()*vel*amp)+.5);
    ob1.scale.z = ((reloj.getElapsedTime()*vel2*amp2)+.5);
    ob1.scale.z =.8;
    //camera.position.set(ob2.position.x, ob2.position.y+18, ob2.position.z-30);
    //camera.lookAt (ob2.position);

  } else if (keys['KeyS']) {
    currentSpeed = Math.max(currentSpeed - desascelaracion, -movmentspeed);
    rot2 = (reloj.getElapsedTime()*vel)*-amp;
    ob1.rotation.z= ((reloj.getElapsedTime()*vel*amp)-.5);
    ob1.scale.z = ((reloj.getElapsedTime()*vel2*amp2)-.5);
    ob1.scale.z =.8;

    //camera.position.set(ob2.position.x, ob2.position.y+18, ob2.position.z+30);
    //camera.lookAt (ob2.position);

  } else {
    ob1.rotation.z=0;
    ob1.scale.z=0.5;

    //camera.lookAt (ob2.position);


      if (currentSpeed > 0) {
        currentSpeed = Math.max(currentSpeed - desascelaracion, 0);
      } else if (currentSpeed < 0) {
        currentSpeed = Math.min(currentSpeed + desascelaracion, 0);
      }
  }

  nave.velocity.set(forward.x * currentSpeed, nave.velocity.y, forward.z * currentSpeed);

  if (keys['KeyA']) {
    nave.angularVelocity.y= rotar;
  } else if (keys['KeyD']) {
    nave.angularVelocity.y= -rotar;
  } else {
    nave.angularVelocity.y= 0;
  }

  nave.angularVelocity.set(0, nave.angularVelocity.y, 0);
  nave.quaternion.x=0;
  nave.quaternion.z=0;
  ob2.quaternion.x=nave.quaternion.x;
  ob2.quaternion.z=nave.quaternion.z;



  if (keys['Space'] && saltillo) {
    nave .velocity.y= vsal;
    saltillo= false;
    //ob1.rotation.x=((reloj.getElapsedTime()*vel*2*amp*2)*.5)+.5;
  }

  let speedMultiplier = 1;

if (puntos >= 3) speedMultiplier = 1.5;
if (puntos >= 6) speedMultiplier = 2;
if (puntos >= 9) speedMultiplier = 3;

nave.velocity.set(
  forward.x * currentSpeed * speedMultiplier,
  nave.velocity.y,
  forward.z * currentSpeed * speedMultiplier
);

 }

//Movimiento de puntos en carriles perrones tipo subway surfers xd

const radioDeteccion = 10;
function updatePuntos() {
  datap.forEach(obj1 => {
    const distancia = obj1.mesh.position.distanceTo(
      ob2.position);
    if (distancia < radioDeteccion) {
      console.log("punto");
      puntos++;
      //puntos=puntos+10;
      moverObjeto(obj1);
    }
    // sincronizar body con mesh (por si usas debug o futuras colisiones)
    obj1.body.position.copy(obj1.mesh.position);
  });
}

function moverObjeto(obj1) {
  let posX;
  let distancia;
  let tempPos; // 👈 AQUÍ ESTÁ LA CLAVE

  const forward = new THREE.Vector3();
  ob2.getWorldDirection(forward);

  do {
    const randomIndex = Math.floor(Math.random() * carrilesX.length);
    posX = carrilesX[randomIndex];

    tempPos = ob2.position.clone().add(
      forward.clone().multiplyScalar(200)
    );

    tempPos.x = posX;
    tempPos.y = 3;

    distancia = tempPos.distanceTo(ob2.position);

  } while (distancia < 50);

  obj1.mesh.position.copy(tempPos);
  obj1.body.position.copy(tempPos);
}

//Movment de haters perrones

const radioDeteccion1 = 10;
function RestarLife() {
  datap1.forEach(obj2 => {
    const distancia1 = obj2.mesh.position.distanceTo(
      ob2.position);
    if (distancia1 < radioDeteccion1) {
      console.log("vida");
      vida=vida-10;
      //puntos=puntos+10;
      moverObjeto1(obj2);
    }
    // sincronizar body con mesh (por si usas debug o futuras colisiones)
    obj2.body.position.copy(obj2.mesh.position);
  });
}

function moverObjeto1(obj2) {
  let randomPosition1;
  let distancia1;
  do {
    const randomIndex = Math.floor(Math.random() * 
    positions1.length);
    randomPosition1 = positions1[randomIndex];
    distancia1 = randomPosition1.distanceTo(ob2.position);
  } while (distancia1 < 10); // distancia mínima

  obj2.mesh.position.copy(randomPosition1);
  obj2.body.position.copy(randomPosition1);
}
