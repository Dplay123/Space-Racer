);

function motor(x){

new THREE.MeshStandardMaterial({color:0x222222})
);

}

//Estrellas

const estrellasCount = 1000;
const estrellasGeometry = new THREE.BufferGeometry();
const posiciones = new Float32Array(estrellasCount*3);

for(let i=0;i<estrellasCount*3;i+=3){

posiciones[i] = (Math.random()-0.5)*800;
posiciones[i+1] = (Math.random()-0.5)*800;
posiciones[i+2] = (Math.random()-0.5)*800;

}

estrellasGeometry.setAttribute(
'position',
new THREE.BufferAttribute(posiciones,3)
);

const estrellasMaterial = new THREE.PointsMaterial({
color:0xffffff,
size:1.2
});

const estrellas = new THREE.Points(estrellasGeometry,estrellasMaterial);

scene.add(estrellas);
scene.add(nave);


// Piedritas

const obstacles = [];

function crearObstaculo(x,y,z){

const asteroide = new THREE.Mesh(

new THREE.MeshStandardMaterial({color:0x777777})

);

obstacles.push(asteroide);

/* CONTROLES Y VELOCIDAD */

const keys = {};

window.addEventListener('keydown', e => keys[e.code] = true);

const clock = new THREE.Clock();

const acelerar = 0.02;
const moveSpeed = 0.6;
const velocidad = 2;

let currentSpeed = 0;

function moverNave(){

const direccion = new THREE.Vector3();
nave.getWorldDirection(direccion);


if (keys['KeyW']){
currentSpeed = Math.min(currentSpeed + acelerar, moveSpeed);
}
else{
currentSpeed *= 0.96;
}
if (keys['KeyS']){
currentSpeed = Math.min(currentSpeed - acelerar, moveSpeed);
}
else{
currentSpeed *= 0.96;
}



nave.position.add(direccion.multiplyScalar(currentSpeed));


if(keys['KeyA']){
nave.rotation.y += 0.04;
}

if(keys['KeyD']){
nave.rotation.y -= 0.04;
}


if(keys['Space']){
velocidadY += impulso;
}


velocidadY += gravedad;
nave.position.y += velocidadY;


if(nave.position.y < 0){
nave.position.y = 0;
velocidadY = 0;
}


nave.rotation.x = Math.cos(clock.getElapsedTime()*velocidad)*0.1;

}

nave.rotation.x = Math.cos(clock.getElapsedTime()*velocidad + moveSpeed)*0.1;
