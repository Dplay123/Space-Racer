  //Programacion de controles

 function tecladones (){
  

  nave.angularVelocity.set(0,0,0);
  nave.quaternion.set(0,0,0,1);

  var forward = new CANNON.Vec3(0, 0, -1);
  osb2.getWorldDirection(forward);
  forward.normalize();
  osb2.position.copy(nave.position);
  osb2.quaternion.copy(nave.quaternion);

  osb2.quaternion.x=nave.quaternion.x;
  osb2.quaternion.z=nave.quaternion.z;


  //Funcion para que la navecita se mueva sola y velocidad progresiva
   speedMultiplier = 10;
   lateralSpeed = 0;


if (keys['KeyA']) {
   lateralSpeed= 15;
    rot2=(reloj.getElapsedTime()*vel)*amp;
    osb1.rotation.z = ((reloj.getElapsedTime()*vel*amp)+.5);
    osb1.scale.z = ((reloj.getElapsedTime()*vel2*amp2)+.5);
    osb1.scale.z =.8;
   if (puntos >= 3){
    lateralSpeed = 20;
   }
   if (puntos >= 6){
    lateralSpeed = 25;
   }
 
} else if (keys['KeyD']) {
   lateralSpeed =- 15;
    rot2 = (reloj.getElapsedTime()*vel)*-amp;
    osb1.rotation.z= ((reloj.getElapsedTime()*vel*amp)-.5);
    osb1.scale.z = ((reloj.getElapsedTime()*vel2*amp2)-.5);
    osb1.scale.z =.8;
   if (puntos >= 3){
    lateralSpeed = -20;
   }
   if (puntos >= 6){
    lateralSpeed = -25;
   }
  
  }
  else {
    rot2=0;
    osb1.rotation.z=0;
    osb1.scale.z=1;
  
} 

nave.velocity.set(
  lateralSpeed * slowFactor,
  nave.velocity.y,
  speedMultiplier * slowFactor
)


 if (slowActivo) {
  slowTimer--;

  if (slowTimer <= 0) {
    slowActivo = false;
    slowFactor = 1; 
  }
}

function CarrilZ(posX, posZ) {
  const todos = [...datap, ...datap1, ...datap2, ...datap3,...datap4];

  return todos.some(obj => {
    const dx = Math.abs(obj.mesh.position.x - posX);
    const dz = Math.abs(obj.mesh.position.z - posZ);

    return dx < 5 && dz < 40; 
  });
}

}
