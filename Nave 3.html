<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nave Marciana</title>

<style>
body{
margin:0;
overflow:hidden;
}
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>

// ESCENA
const scene = new THREE.Scene();

// CAMARA
const camera = new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.z = 6;

// RENDER
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// CONTROLES PARA MOVER EL ESPACIO
const controls = new THREE.OrbitControls(camera, renderer.domElement);

// LUZ
const light = new THREE.AmbientLight(0xF7F6E5,1);
light.position.set(5,5,5);
scene.add(light);

// CARGAR TEXTURA
const textureLoader = new THREE.TextureLoader();

const metalTexture = textureLoader.load('images/nave.jpg');

const glassTexture = textureLoader.load('images/vidrio.jpg');

// BASE DE LA NAVE
const baseGeometry = new THREE.CylinderGeometry(2,2,0.4,32);
const baseMaterial = new THREE.MeshStandardMaterial({
map: metalTexture
});
const base = new THREE.Mesh(baseGeometry, baseMaterial);
scene.add(base);

// Capsula
const domeGeometry = new THREE.SphereGeometry(1,32,32,0,Math.PI*2,0,Math.PI/2);

const domeMaterial = new THREE.MeshStandardMaterial({
map: glassTexture
});

const dome = new THREE.Mesh(domeGeometry, domeMaterial);
dome.position.y = 0.2;
scene.add(dome);



// FONDO NEGRO (ESPACIO)
scene.background = new THREE.Color(0x000000);

// RENDER
function animate(){

requestAnimationFrame(animate);
controls.update();
renderer.render(scene,camera);

}

animate();

</script>

</body>
</html>
